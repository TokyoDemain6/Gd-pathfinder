name: Performance checks

# Measures the simulator and compares every number with bench/baseline.json.
# A run fails when a number moves and the baseline was not updated in the same
# change. bench/README.md explains each check and how to accept a change.

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  speed:
    name: Speed, memory and behaviour
    # Instruction counts are compared with numbers recorded on this image and
    # compiler, so both are named exactly instead of using "latest".
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind libc6-dbg

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13
          cmake --build build -j

      - name: Measure and compare
        run: >
          python3 bench/perf.py --build-dir build
          --sections scenarios,sizes,table,work,instructions,speed
          --results perf-speed.json --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: perf-results-speed
          path: perf-speed.json
          if-no-files-found: ignore

  identical:
    # The simulator must give the same run, bit for bit, whatever it is built
    # with: a path found on one machine has to replay on another.
    name: Same result on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux with Clang
            os: ubuntu-24.04
            configure: -DCMAKE_CXX_COMPILER=clang++
          - name: Linux on Arm
            os: ubuntu-24.04-arm
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
          cmake --build build --config Release

      - name: Compare with the baseline
        run: |
          # Whichever of these is a working Python 3 on this runner.
          for py in python3 python; do
            if "$py" -c 'import sys; sys.exit(sys.version_info < (3, 8))' 2>/dev/null; then break; fi
          done
          "$py" bench/perf.py --build-dir build --sections scenarios --summary "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Test coverage
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install gcovr
        # A fixed version: the percentages depend slightly on the tool.
        run: python -m pip install gcovr==8.6

      - name: Measure and compare
        env:
          CXX: g++-13
        run: >
          python bench/perf.py --build-dir build --sections coverage
          --results perf-coverage.json --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: perf-results-coverage
          path: perf-coverage.json
          if-no-files-found: ignore

  mutation:
    name: Tests pin the physics numbers
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Measure and compare
        env:
          CXX: g++-13
        run: >
          python3 bench/perf.py --sections mutation
          --results perf-mutation.json --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: perf-results-mutation
          path: perf-mutation.json
          if-no-files-found: ignore

  baseline:
    # Puts this run's numbers into one ready-to-commit baseline file, so an
    # intended change can be accepted without measuring anything locally.
    name: Baseline candidate
    needs: [speed, coverage, mutation]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: perf-results-*
          path: results
          merge-multiple: true

      - name: Combine the results
        run: |
          shopt -s nullglob
          files=(results/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No measurements were produced by this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 bench/perf.py --merge "${files[@]}" --candidate baseline.json
          {
            echo "## Baseline candidate"
            echo
            echo "The \`baseline-candidate\` artifact holds \`baseline.json\`: the committed baseline with this run's numbers written over it."
            echo "It is only needed when a check failed **and** the change was intended: commit it as \`bench/baseline.json\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: baseline-candidate
          path: baseline.json
          if-no-files-found: ignore
